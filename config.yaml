app:
  name: GreenMart
  port: 8080
  version: 1.0.0
  environment: development
  write_timeout: 15s
  read_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 30s

database:
  enabled: true
  host: localhost
  driver: postgres
  port: 5432
  user: "[DB_USER]"
  password: "[DB_PASS]"
  name: "[DB_NAME]"
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m

logger:
  enabled: true
  level: debug # debug, info, warn, error
  format: console # json, console
  output: stdout # stdout, file
  path: ./logs/app.log
  max_size: 100 # megabytes
  max_backups: 7
  max_age: 30 # days
  compress: true # disabled by default

token:
  expired_token: 15m
  expired_refresh_token: 168h
  access_private_key_pem: ""
  access_public_key_pem: ""
  refresh_private_key_pem: ""
  refresh_public_key_pem: ""

rate_limit:
  limit: 1000
  window: 1m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10
  timeout: 5s

business:
  min_stock_checkout: 1
  max_cart_items: 50
  order_expiry_hours: 24

smtp:
  host: "smtp.gmail.com"
  port: 587
  username: "[SMTP_USER]"
  password: "[SMTP_PASS]"
  sender_name: "GreenMart"
  sender_email: "[EMAIL_FROM]"

oauth:
  google_client_id: "[GOOGLE_CLIENT_ID]"
