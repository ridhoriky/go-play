paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns access and refresh
        tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ne-project_src_internal_models_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
